name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site && cp -r index.html shell.css shell.js video.html style.css app.js vendor fonts _site/
          v=${GITHUB_SHA::8}
          sed -i "s#shell.css#shell.css?v=$v#; s#shell.js#shell.js?v=$v#" _site/index.html
          sed -i "s#style.css#style.css?v=$v#; s#app.js#app.js?v=$v#" _site/video.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
